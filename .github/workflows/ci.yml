name: CI

on:
  push:
    branches: [ develop, master ]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # los gates futuros necesitan historial para el diff

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Puerta de calidad
        run: node quality/verify.mjs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: Icarus/global.json
      - name: Build
        run: dotnet build Icarus/Icarus.sln --nologo
      - name: Tests
        run: dotnet test Icarus/Icarus.sln --nologo --no-build
