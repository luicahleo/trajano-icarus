# Servicios opcionales de desarrollo. Uso: docker compose -f docker-compose.dev.yml up -d
# Seq queda en http://localhost:5341
services:
  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

volumes:
  seq-data:
