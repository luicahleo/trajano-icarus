# Orquestación de desarrollo local para la API: SQL Server + API (.NET) + Seq.
# El frontend se desarrolla con `npm run dev` en el host (Vite proxya /api al
# contenedor api). El stack PC (iniciar-pc*.ps1) usa el artefacto de producción
# (docker-compose.prodlocal.yml): este compose no incluye la web de Vite.
# Uso: cp .env.example .env  (ajusta SA_PASSWORD)  ->  docker compose -f docker-compose.dev.yml up -d
# La API queda en http://localhost:8080, Seq en http://localhost:5341 y SQL
# Server en localhost,1433 (sa / ${SA_PASSWORD}, credencial solo de desarrollo,
# coincide con appsettings.Development.json para correr sin Docker).
services:
  seq:
    image: datalust/seq:2026.1
    environment:
      ACCEPT_EULA: "Y"
      # Seq reciente exige admin o renuncia explícita a autenticación en el
      # primer arranque; sin auth alcanza para desarrollo local (solo localhost).
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      # La UI de Seq solo se expone en localhost, nunca en la LAN (spec).
      - "127.0.0.1:5341:80"
    volumes:
      - seq-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ./Icarus
      dockerfile: src/Host/Icarus.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      # Cadena de conexión apuntando al servicio sqlserver dentro de la red de compose.
      ConnectionStrings__Icarus: "Server=sqlserver,1433;Database=Icarus;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      # Contraseña de las cuentas semilla (paridad con Caserito, SeedUsuariosDesarrollo).
      Semilla__ContrasenaPrueba: "${ICARUS_SEMILLA_PASSWORD:-Semilla-Dev-1234}"
      # Dentro del contenedor localhost no es el host: Seq se alcanza por la red
      # de compose; la API key es opcional (el Seq local no exige auth).
      Seq__Url: "http://seq:80"
      Seq__ApiKey: "${SEQ_API_KEY:-}"
      # Volumen privado de respaldos de notas (spec SP8C): fuera del web root,
      # persistente entre recreaciones del contenedor (no es backup por sí solo).
      AlmacenDocumentosPedido__Ruta: "/app/documentos-pedidos"
    ports:
      - "8080:8080"
    volumes:
      - documentos-pedidos:/app/documentos-pedidos
    restart: unless-stopped
    depends_on:
      sqlserver:
        # Espera a que sqlserver pase el healthcheck antes de arrancar la API.
        condition: service_healthy

volumes:
  seq-data:
  mssql-data:
  documentos-pedidos:
