# Orquestación de desarrollo local: SQL Server + API (.NET) + Web (Vite/React) + Seq.
# Uso: docker compose -f docker-compose.dev.yml up -d
# La API queda en http://localhost:8080, la web en http://localhost:5173
# (proxya /api hacia la API), Seq en http://localhost:5341 y SQL Server en
# localhost,1433 (sa / Icarus-Dev-1234, credencial solo de desarrollo, coincide
# con appsettings.Development.json para correr sin Docker).
services:
  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      # Seq reciente exige admin o renuncia explícita a autenticación en el
      # primer arranque; sin auth alcanza para desarrollo local.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Icarus-Dev-1234"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ./Icarus
      dockerfile: src/Host/Icarus.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      # Cadena de conexión apuntando al servicio sqlserver dentro de la red de compose.
      ConnectionStrings__Icarus: "Server=sqlserver,1433;Database=Icarus;User Id=sa;Password=Icarus-Dev-1234;TrustServerCertificate=True"
      # Dentro del contenedor localhost no es el host: Seq se alcanza por la red de compose.
      Serilog__WriteTo__0__Args__serverUrl: "http://seq:80"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        # Espera a que sqlserver pase el healthcheck antes de arrancar la API.
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      # El dev server de Vite proxya /api hacia el contenedor api (no localhost).
      VITE_API_PROXY_TARGET: "http://api:8080"
    ports:
      - "5173:5173"
    volumes:
      # Bind mount del código fuente para HMR; volumen anónimo para no pisar
      # las node_modules instaladas dentro de la imagen con las del host.
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  seq-data:
  mssql-data:
