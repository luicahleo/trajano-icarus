# Orquestación de desarrollo local: SQL Server + API (.NET) + Web (Vite/React) + Seq.
# Uso: cp .env.example .env  (ajusta SA_PASSWORD)  ->  docker compose -f docker-compose.dev.yml up -d
# La API queda en http://localhost:8080, la web en http://localhost:5173
# (proxya /api hacia la API), Seq en http://localhost:5341 y SQL Server en
# localhost,1433 (sa / ${SA_PASSWORD}, credencial solo de desarrollo, coincide
# con appsettings.Development.json para correr sin Docker).
services:
  seq:
    image: datalust/seq:2026.1
    environment:
      ACCEPT_EULA: "Y"
      # Seq reciente exige admin o renuncia explícita a autenticación en el
      # primer arranque; sin auth alcanza para desarrollo local (solo localhost).
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      # La UI de Seq solo se expone en localhost, nunca en la LAN (spec).
      - "127.0.0.1:5341:80"
    volumes:
      - seq-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ./Icarus
      dockerfile: src/Host/Icarus.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      # Cadena de conexión apuntando al servicio sqlserver dentro de la red de compose.
      ConnectionStrings__Icarus: "Server=sqlserver,1433;Database=Icarus;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      # Contraseña de las cuentas semilla (paridad con Caserito, SeedUsuariosDesarrollo).
      Semilla__ContrasenaPrueba: "${ICARUS_SEMILLA_PASSWORD:-Semilla-Dev-1234}"
      # Dentro del contenedor localhost no es el host: Seq se alcanza por la red
      # de compose; la API key es opcional (el Seq local no exige auth).
      Seq__Url: "http://seq:80"
      Seq__ApiKey: "${SEQ_API_KEY:-}"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        # Espera a que sqlserver pase el healthcheck antes de arrancar la API.
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      # El dev server de Vite proxya /api hacia el contenedor api (no localhost).
      VITE_API_PROXY_TARGET: "http://api:8080"
    ports:
      - "5173:5173"
    volumes:
      # Bind mount del código fuente para HMR; volumen anónimo para no pisar
      # las node_modules instaladas dentro de la imagen con las del host.
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  seq-data:
  mssql-data:
