# Extensión para probar Icarus desde un móvil en la Wi-Fi de PC3.
# Usar mediante iniciar-pc3.ps1; ICARUS_LAN_IP e ICARUS_LAN_HOST son
# obligatorias (las pone el script). La web es el build de producción
# (docker-compose.prodlocal.yml): sin dev server de Vite en el stack PC.
services:
  gateway:
    image: caddy:2.10.2-alpine
    container_name: icarus-gateway
    environment:
      ICARUS_LAN_IP: "${ICARUS_LAN_IP}"
      ICARUS_LAN_HOST: "${ICARUS_LAN_HOST}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/pc3/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.local/pc3/caddy-data:/data
      - ./.local/pc3/caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped
